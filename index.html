<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Magnifica Humanitas</title>
<meta name="description" content="Pope Leo XIV's first encyclical, on safeguarding the human person in the time of artificial intelligence. Scan or tap to read it on your phone.">
<meta name="theme-color" content="#070a12">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Magnifica">
<meta property="og:type" content="website">
<meta property="og:title" content="Magnifica Humanitas">
<meta property="og:description" content="Pope Leo XIV's first encyclical, on safeguarding the human person in the time of artificial intelligence.">
<meta property="og:image" content="https://juanalbertoramos.github.io/magnifica-card/bg.jpg">
<link rel="preload" href="fonts/cinzel-decorative-700.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Cinzel Decorative";font-weight:700;font-display:swap;src:url(fonts/cinzel-decorative-700.woff2) format("woff2")}
@font-face{font-family:"Cormorant Garamond";font-style:italic;font-weight:400 600;font-display:swap;src:url(fonts/cormorant-garamond-italic.woff2) format("woff2")}
@font-face{font-family:"Inter";font-weight:400 600;font-display:swap;src:url(fonts/inter.woff2) format("woff2")}
:root{
  --gold-bright:#ecdca6; --cream:#fff6e2; --ink:#1b140a;
  --grad-gold:linear-gradient(135deg,#fff3d0 0%,#ecdca6 30%,#c8a44d 65%,#9a7b2e 100%);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#070a12}
body{font-family:"Inter",-apple-system,system-ui,sans-serif;color:var(--cream);-webkit-font-smoothing:antialiased;overflow:hidden}

/* The living background: a seamless loop (the Kling clip forward, then reversed). The poster paints first. */
.bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.scrim{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(180deg,rgba(4,6,12,.55) 0%,rgba(4,6,12,0) 14%,rgba(4,6,12,0) 44%,rgba(4,6,12,.62) 70%,rgba(4,6,12,.86) 100%)}

.ui{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 20px) 20px calc(env(safe-area-inset-bottom) + 18px)}
.kicker{text-align:center;font:600 10px/1 "Inter";letter-spacing:.34em;text-transform:uppercase;color:var(--gold-bright)}
.titles{position:relative;text-align:center;margin-top:auto;margin-bottom:20px}
/* a soft dark halo keeps the title legible where it crosses the bright beam of the cross */
.titles::before{content:"";position:absolute;left:-20px;right:-20px;top:-26px;bottom:-18px;z-index:-1;
  background:radial-gradient(closest-side,rgba(4,6,12,.62),rgba(4,6,12,0))}
h1{font:700 44px/.98 "Cinzel Decorative",Georgia,serif;letter-spacing:.02em;
   background:var(--grad-gold);-webkit-background-clip:text;background-clip:text;color:transparent;
   filter:drop-shadow(0 2px 16px rgba(0,0,0,.85)) drop-shadow(0 0 2px rgba(0,0,0,.6))}
.sub{font:italic 500 20px/1.28 "Cormorant Garamond",Georgia,serif;color:var(--cream);max-width:30ch;margin:12px auto 0;text-shadow:0 1px 12px rgba(0,0,0,.85)}

.panel{border-radius:24px;padding:14px;background:rgba(10,12,20,.42);
  -webkit-backdrop-filter:blur(16px) saturate(1.3);backdrop-filter:blur(16px) saturate(1.3);
  box-shadow:inset 0 0 0 1px rgba(236,220,166,.22),0 24px 44px -22px rgba(0,0,0,.8)}
.scan{display:flex;gap:14px;align-items:center}
.qr{flex:0 0 132px;width:132px;height:132px;display:block;background:#fff;border-radius:14px;padding:9px}
.scan h2{font:600 16px/1.25 "Inter";color:var(--cream);margin-bottom:6px}
.scan p{font:400 13px/1.45 "Inter";color:rgba(255,246,226,.8)}
.scan a{display:inline-block;margin-top:8px;font:600 12.5px/1 "Inter";color:var(--gold-bright);text-decoration:none}
.share{margin-top:14px;width:100%;height:54px;border:0;border-radius:16px;background:var(--grad-gold);color:var(--ink);
  display:flex;align-items:center;justify-content:center;gap:10px;font:600 17px/1 "Inter";letter-spacing:.01em;cursor:pointer;
  box-shadow:0 12px 26px -12px rgba(200,164,77,.55),inset 0 1px 0 rgba(255,255,255,.45)}
.share:active{transform:scale(.985)}
.share svg{width:20px;height:20px}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);z-index:3;transform:translate(-50%,16px);opacity:0;
  max-width:86vw;padding:10px 16px;border-radius:999px;background:rgba(10,12,20,.9);color:var(--cream);
  font:500 13px/1.3 "Inter";text-align:center;box-shadow:inset 0 0 0 1px rgba(236,220,166,.25);
  transition:opacity .25s,transform .25s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* Low Power Mode blocks autoplay (the poster shows); reduced motion swaps the loop for the still */
@media (prefers-reduced-motion:reduce){.bg{display:none}body{background:#070a12 url(bg.jpg) center/cover}}
</style>
</head>
<body>
<video class="bg" src="bg.mp4" poster="bg.jpg" autoplay muted loop playsinline preload="auto" aria-hidden="true"></video>
<div class="scrim"></div>

<main class="ui">
  <div class="kicker">Pope Leo XIV · First Encyclical</div>
  <div class="titles">
    <h1>Magnifica<br>Humanitas</h1>
    <div class="sub">On safeguarding the human person in the time of artificial intelligence</div>
  </div>
  <section class="panel">
    <div class="scan">
      <img class="qr" id="qr" src="qr.svg" width="132" height="132" alt="QR code that opens the Magnifica Humanitas reader">
      <div>
        <h2>Scan to read it on your phone</h2>
        <p>The full encyclical, beautifully set. Read it or listen to it.</p>
        <a id="open" href="https://juanalbertoramos.github.io/magnifica-humanitas/" target="_blank" rel="noopener">Open it here ›</a>
      </div>
    </div>
    <button class="share" id="share" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m8 7 4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>Share</button>
  </section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
  const READER = 'https://juanalbertoramos.github.io/magnifica-humanitas/';
  const SHARE = {
    title: 'Magnifica Humanitas',
    text: "Pope Leo XIV's first encyclical, Magnifica Humanitas, on safeguarding the human person in the time of artificial intelligence. A beautiful edition you can read or listen to on your phone:",
    url: READER,
  };

  const toastEl = document.getElementById('toast');
  function toast(message) {
    toastEl.textContent = message;
    toastEl.classList.add('show');
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => toastEl.classList.remove('show'), 2600);
  }

  // One button: the iPhone share sheet (WhatsApp, Messages, Mail, AirDrop, Copy); copy the message where there is none.
  document.getElementById('share').addEventListener('click', async () => {
    if (navigator.share) {
      try { await navigator.share(SHARE); } catch (e) { /* share sheet dismissed */ }
      return;
    }
    try {
      await navigator.clipboard.writeText(`${SHARE.text} ${SHARE.url}`);
      toast('Link copied. Paste it into any message.');
    } catch (e) {
      toast(SHARE.url);
    }
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
  }
</script>
</body>
</html>
